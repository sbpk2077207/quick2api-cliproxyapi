<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazon Quick (quick2api)</title>
<style>
:root {
  color-scheme: dark;
  --bg: #12141A; --fg: #E6E8ED; --muted: #8B909B;
  --card: rgba(30,33,40,.86); --pop: #1B1E25;
  --glass: rgba(28,31,38,.72); --raised: rgba(255,255,255,.055);
  --border: rgba(255,255,255,.085); --border-strong: rgba(255,255,255,.17);
  --accent: #7FA6C8; --accent-2: #5C7C97;
  --accent-soft: rgba(127,166,200,.14); --accent-line: rgba(127,166,200,.32);
  --grad: linear-gradient(135deg,#5C7C97 0%,#4A6D8C 45%,#3B5163 100%);
  --ok: #6FBF93; --ok-soft: rgba(111,191,147,.14);
  --warn: #D2A85F; --warn-soft: rgba(210,168,95,.14);
  --err: #E0847A; --err-soft: rgba(224,132,122,.14);
  --row-hover: rgba(127,166,200,.08);
  --shadow-card: 0 1px 2px rgba(0,0,0,.32), 0 8px 24px -12px rgba(0,0,0,.55);
  --shadow-pop: 0 2px 6px rgba(0,0,0,.38), 0 22px 48px -20px rgba(0,0,0,.72);
  --radius: 14px;
  --ease: cubic-bezier(.32,.72,0,1); --ease-out: cubic-bezier(.16,1,.3,1);
  --ff: -apple-system,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --ff-mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--fg); font: 13.5px/1.55 var(--ff);
  -webkit-font-smoothing: antialiased; min-height: 100vh;
  background:
    radial-gradient(1100px 460px at 12% -10%, rgba(127,166,200,.10), transparent 60%),
    radial-gradient(900px 420px at 92% 0%, rgba(92,124,151,.08), transparent 62%),
    var(--bg);
}
[hidden] { display: none !important; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---- 头部 ---- */
header {
  margin: 16px 22px 0; padding: 18px 24px; border-radius: var(--radius);
  background: var(--glass); border: 1px solid var(--border);
  box-shadow: var(--shadow-card); backdrop-filter: blur(14px);
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  position: relative; overflow: hidden;
}
header::before {
  content: ""; position: absolute; inset: -40% auto auto -6%;
  width: 340px; height: 340px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(127,166,200,.16), transparent 68%);
}
header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.3px; position: relative; }
header .sub { color: var(--muted); font-size: 12.5px; position: relative; }
header .spacer { flex: 1 1 auto; }
select {
  background: var(--raised); color: var(--fg); border: 1px solid var(--border-strong);
  border-radius: 9px; padding: 6px 10px; font: inherit; cursor: pointer;
}
select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent-line); outline-offset: 1px; }

main { padding: 16px 22px 56px; max-width: 1180px; }

/* ---- 卡片 ---- */
.card {
  background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; box-shadow: var(--shadow-card); margin-bottom: 16px;
  backdrop-filter: blur(10px);
}
.card > h2 {
  margin: 0 0 14px; font-size: 14.5px; font-weight: 700;
  display: flex; align-items: center; gap: 9px;
}
.card > h2::before {
  content: ""; width: 9px; height: 9px; border-radius: 3px;
  background: var(--grad); box-shadow: 0 0 0 3px var(--accent-soft);
}
.section-head {
  display: flex; align-items: center; gap: 12px; margin: 22px 2px 12px; flex-wrap: wrap;
}
.section-head h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.section-head .count { color: var(--muted); font-size: 12.5px; font-weight: 400; }
.section-head .spacer { flex: 1 1 auto; }

/* ---- 表单与按钮 ---- */
.row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1 1 0; min-width: 0; }
input[type=text], input[type=password], input[type=tel], textarea {
  background: var(--raised); color: var(--fg); border: 1px solid var(--border-strong);
  border-radius: 9px; padding: 8px 11px; font: inherit; width: 100%;
}
textarea { resize: vertical; font-family: var(--ff-mono); font-size: 12px; }
button.act {
  padding: 7px 14px; border: 1px solid var(--border-strong); border-radius: 9px;
  background: var(--raised); color: var(--fg); font: inherit; font-size: 12.5px;
  cursor: pointer; transition: all .16s var(--ease); white-space: nowrap;
}
button.act:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
button.act:active:not(:disabled) { transform: scale(.98); }
button.act:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--grad); border-color: transparent; color: #fff; font-weight: 600; }
button.primary:hover:not(:disabled) { filter: brightness(1.1); color: #fff; }
button.danger:hover:not(:disabled) { color: var(--err); border-color: var(--err); background: var(--err-soft); }
button.link {
  background: none; border: none; color: var(--accent); font: inherit; cursor: pointer;
  padding: 0; font-size: 12.5px;
}
button.link:hover { text-decoration: underline; }

/* ---- 状态点与徽标 ---- */
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.dot.err { background: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
  border-radius: 999px; font-size: 11.5px; border: 1px solid transparent; white-space: nowrap;
}
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.err { color: var(--err); background: var(--err-soft); }
.pill.mute { color: var(--muted); background: var(--raised); border-color: var(--border); }

/* ---- 账号卡片网格 ---- */
.account-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.acct {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 15px 16px; transition: border-color .16s var(--ease), transform .16s var(--ease);
  position: relative;
}
.acct:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.acct.off { opacity: .62; }
.acct-top { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.acct-name {
  font-weight: 650; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; flex: 1 1 auto; min-width: 0;
}
.acct-meta { color: var(--muted); font-size: 12px; line-height: 1.75; }
.acct-meta b { color: var(--fg); font-weight: 500; }
.acct-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.acct-actions button.act { padding: 5px 11px; font-size: 12px; }
.acct-edit { width: 100%; margin-top: 8px; }

/* ---- 模型表 ---- */
.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); }
thead th { background: var(--raised); color: var(--muted); font-weight: 600; font-size: 11.5px; white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--row-hover); }
td.mono { font-family: var(--ff-mono); font-size: 12px; }

/* ---- 横幅 ---- */
.banner {
  display: none; margin-bottom: 14px; padding: 11px 15px; border-radius: 11px;
  border: 1px solid var(--border-strong); background: var(--glass); font-size: 12.5px;
  align-items: center; gap: 10px;
}
.banner.show { display: flex; }
.banner.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.banner.warn { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.banner.err { border-color: var(--err); background: var(--err-soft); color: var(--err); }
.banner .close {
  margin-left: auto; background: none; border: none; color: inherit;
  font-size: 16px; cursor: pointer; opacity: .7; padding: 0 4px;
}
.banner .close:hover { opacity: 1; }

.hint { color: var(--muted); font-size: 12px; line-height: 1.7; margin-top: 8px; }
.muted { color: var(--muted); }
.empty {
  padding: 30px 20px; text-align: center; color: var(--muted); font-size: 12.5px;
  border: 1px dashed var(--border-strong); border-radius: 12px;
}

/* ---- 弹窗 ---- */
.modal {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center;
  justify-content: center; padding: 22px; background: rgba(8,10,14,.68);
  backdrop-filter: blur(6px);
}
.modal-box {
  background: var(--pop); border: 1px solid var(--border-strong); border-radius: var(--radius);
  padding: 22px; width: min(620px, 100%); box-shadow: var(--shadow-pop);
  max-height: 88vh; overflow-y: auto;
}
.modal-box h2 { margin: 0 0 14px; font-size: 15.5px; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--accent); font-size: 12.5px; user-select: none; }
summary:hover { text-decoration: underline; }
</style>
</head>
