<body>
<header>
  <h1>Amazon Quick</h1>
  <span class="sub">Amazon Quick 账号与模型管理 · 免桌面端直连</span>
  <span class="spacer"></span>
  <select id="language" aria-label="Language / 语言">
    <option value="zh-CN">中文</option>
    <option value="en">English</option>
  </select>
</header>

<main>
  <div class="card" id="keyBox" hidden>
    <h2>管理密钥</h2>
    <div class="row">
      <input type="password" id="keyInput" placeholder="填入 CPA 管理密钥" class="grow">
      <button class="act primary" id="btnUseKey">使用</button>
    </div>
    <div class="hint">
      <span id="keyStatus" class="muted"></span><br>
      本页会自动复用 CPA 管理面板已保存的密钥（面板需勾选「记住密码」）；读不到时在此填入一次即可。
    </div>
  </div>

  <div id="banner" class="banner"></div>

  <div class="section-head">
    <h2>账号</h2>
    <span class="count" id="accountCount"></span>
    <span class="spacer"></span>
    <button class="act primary" id="btnAddAccount">添加账号</button>
  </div>
  <div id="accounts" class="account-grid"></div>

  <div class="section-head">
    <h2>模型</h2>
    <span class="count" id="modelCount"></span>
    <span class="spacer"></span>
    <label class="muted" style="font-size:12.5px">筛选
      <input type="text" id="modelFilter" placeholder="筛选模型" style="width:150px">
    </label>
  </div>
  <div class="card">
    <div class="hint" style="margin:0 0 10px">点击模型名可设置别名（留空恢复官方 ID）。</div>
    <div id="models"></div>
  </div>
</main>

<div class="modal" id="loginModal" hidden>
  <div class="modal-box">
    <h2>添加 Amazon Quick 账号</h2>
    <div class="hint" id="loginStatus" style="margin-top:0">正在获取授权链接…</div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="loginUrl" readonly class="grow">
    </div>
    <div class="modal-actions">
      <button class="act primary" id="btnOpenUrl">打开授权页</button>
      <button class="act" id="btnCopyUrl">复制链接</button>
      <button class="act" id="btnCancel">取消</button>
    </div>
    <details id="pasteBox" hidden>
      <summary>授权没回到本机？粘贴回调链接</summary>
      <div class="hint" id="pasteHint"></div>
      <textarea id="pasteUrl" rows="3" placeholder="把浏览器地址栏里的整条 localhost 链接粘贴到这里"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="act" id="btnSubmitCallback">提交</button>
        <span class="hint" id="pasteStatus" style="margin:0"></span>
      </div>
    </details>
  </div>
</div>
